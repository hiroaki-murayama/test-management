<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#286754"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"><link rel="stylesheet" href="./schedule.css"><title>カレンダー · Research &amp; PhD</title></head>
<body class="calendar-page"><header class="schedule-head"><a href="./">← ワークスペース</a><span>端末内保存</span></header>
<main><h1>研究カレンダー</h1><p>締切、打ち合わせ、研究室の予定を日付で確認できます。</p>
<div class="calendar-toolbar"><div><button id="prev-month" aria-label="前の月">‹</button> <button id="this-month">今日</button> <button id="next-month" aria-label="次の月">›</button></div><h2 id="month-title" aria-live="polite"></h2><button class="calendar-primary" id="add-event">＋ 予定・タスクを追加</button></div>
<div class="calendar-grid" id="calendar-grid" aria-label="月間カレンダー"></div>
<div class="calendar-actions"><h2 id="day-title"></h2><label><input id="show-completed" type="checkbox"> 完了・提出済も表示</label></div>
<ul class="calendar-events" id="day-events"></ul><p id="calendar-error" role="alert"></p>
<dialog id="event-dialog"><form id="event-form"><h2 id="event-heading">予定・タスクを追加</h2><label>タイトル<input id="event-title" required maxlength="200" placeholder="例：研究室ミーティング"></label><label>締切・予定日（日本時間）<input id="event-date" type="date" required></label><label>ステータス<select id="event-status"></select></label><label id="event-parent-label">関連先（任意）<select id="event-parent"></select></label><p id="event-error" role="alert"></p><div class="calendar-actions"><button id="close-event" type="button">キャンセル</button><button class="calendar-primary" type="submit">保存する</button></div></form></dialog>
</main><script type="module" src="./schedule.js"></script></body></html>
